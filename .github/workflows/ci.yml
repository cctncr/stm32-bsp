name: CI

on: push

jobs:
  host:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Tool versions
        run: |
          cc --version
          cppcheck --version
          make --version

      - name: Unit tests
        run: make test

      - name: Static analysis
        run: make lint
